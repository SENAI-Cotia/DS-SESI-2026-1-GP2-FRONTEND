<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Técnico ou Funcionário</title>
</head>
<link rel="stylesheet" href="/style/cadastropages/cadastros.css">
<body>
        <div class="container">
        <div class="card">
            <div class="robo"><img src="/svg/robo-img.svg" alt="robo"></div>
            <div class="logo"><img src="/svg/logo-helpyfast.svg" alt="logo"></div>

            <h3>Cadastro</h3>
            <h4>Informe os dados do usuário</h4>

            <div class="card-inform">

            <div class="input-grupo">
                <h5>
                    <img src="/svg/user-img.svg" alt="user" class="icon-h5">
                    Nome
                </h5>
                <input type="text" id="nome" placeholder="Insira seu nome">
            </div>

            <div class="input-grupo">
                <h5>
                    <img src="/svg/user-img.svg" alt="user" class="icon-h5">
                    E-mail
                </h5>
                <input type="email" id="email" placeholder="Insira seu email">
            </div>

            <div class="input-grupo">
                <h5>
                    <img src="/svg/especialidade-img.svg" alt="especialidade" class="icon-h5">
                    Funcionário ou Técnico
                </h5>
                <select name="especialidade" id="especialidade">
                    <option value="" disabled selected>Selecione a Especialidade</option>
                    <option value="funcionario">Funcionário</option>
                    <option value="tecnico">Técnico</option>
                </select>
            </div>
            
            <button class="botao-continuar" id="btnContinuar">Continuar</button>

            <!-- bolinhas de navegação "Pagination Dots ou Steppers" -->
             <div class="passos">
                <span class="ponto-ativo"></span>
                <span class="ponto"></span>
                <span class="ponto"></span>
             </div>
        </div>
    </div>

    <!-- JAVA SCRIPT -->
    <script src="/javascript/cadastro.js"></script>

</body>
</html>
