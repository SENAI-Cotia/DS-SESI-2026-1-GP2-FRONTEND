<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem sou eu?</title>
    <link rel="stylesheet" href="/style/loginpages/quem-sou.css">
</head>
<body>
    <div class="container">
        <div class="card">

            <div class="logo"><img src="/svg/logo-helpyfast.svg" alt="logo"></div>

            <h3>Quem eu sou?</h3>

            <div class="botoes-container">

                <button class="areas" onclick="definirTipo('adm')">
                    ADM
                        <img src="/svg/adm-img.svg" alt="adm">
                </button>

                <button class="areas" onclick="definirTipo('funcionario')">
                    FUNCIONÁRIO
                        <img src="/svg/funcionario-img.svg" alt="funcionario">
                </button>

                <button class="areas" onclick="definirTipo('tecnico')">
                    TÉCNICO
                        <img src="/svg/tecnico-img.svg" alt="tecnico">
                </button>
           </div>

        </div>
    </div>

     <script src="/javascript/quem-sou.js"></script>
</body>
</html>
