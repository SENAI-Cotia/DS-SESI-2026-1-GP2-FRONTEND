 
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem sou eu?</title>
    <link rel="stylesheet" href="/style/login-perfil/quem-sou.css">
</head>
<body>
    <div class="container">
        <div class="card">
 
            <div class="logo"><img src="/IMG/logo-helpyfast.png" alt="logo"></div>
 
            <h3>Quem eu sou?</h3>
 
            <div class="botoes-container">
 
                <button class="areas" onclick="definirTipo('adm')">
                    ADM
                        <img src="/svg/adm-img.svg" alt="adm">
                </button>
 
                <button class="areas" onclick="definirTipo('funcionario')">
                    FUNCIONÁRIO
                        <img src="/svg/funcionario-img.svg" alt="funcionario">
                </button>
 
                <button class="areas" onclick="definirTipo('tecnico')">
                    TÉCNICO
                        <img src="/svg/tecnico-img.svg" alt="tecnico">
                </button>
           </div>
 
        </div>
    </div>
 
    <!-- script para salvar a escolha antes de mudar de página -->
     <script>
        function definirTipo(tipo) {
            // salva a informação de quem que está indo para próxima página
            localStorage.setItem('tipoUsuario', tipo);
           
            // vai para tela de login
            window.location.href = '/pages/login/perfis/quem-sou.html';
        }
     </script>
</body>
</html>
