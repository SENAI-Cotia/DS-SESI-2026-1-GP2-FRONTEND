<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/style/loginpages/login.css">
</head>
<body>
    <div class="container">
        <div class="card">

            <div class="logo"><img src="/svg/logo-helpyfast.svg" alt="logo"></div>

            <h3>Bem-vindo, vamos começar!</h3>
            <h4>Faça o login na sua conta!</h4>

            <!-- Facilitando para o back-end -->
            <form id="form-login">
                <h5>Email</h5>
                <div class="login-container">
                    <input type="email" id="email" placeholder="Insira seu email">
                </div>

            <div class="input-grupo">
                <h5>Senha</h5>
                <div class="senha-container">
                <input type="password" id="senha" placeholder="Insira sua senha">

                <span class="olhinho" onclick="toggleSenha()">
                    <!-- Adicionando id="iconeOlho" -->
                    <img src="/svg/ocultar-senha.svg" id="iconeOlho" alt="olhinho ocultar senha">
                </span>
                </div>

                </div>

                <!-- campo "oculto" para o back-end -->
                <input type="hidden" id="tipo-usuario-input">

                <div class="mais-opcoes">

                <a href="/pages/cadastropages/esqueci-senha.html" class="esqueci">Esqueceu sua senha?</a>
                </div>    

                <button type="submit" class="botao-entrar" id="btnEntrar">Entrar</button>

            </form>
        </div>
    </div>

    <script src="/javascript/login.js"></script>

</body>
</html>
