<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha</title>
</head>
<link rel="stylesheet" href="/style/cadastropages/criar-senha.css">
<body>
    <div class="container">
        <div class="card">
            <div class="robo"><img src="/svg/robo-img.svg" alt="robo"></div>
            <div class="logo"><img src="/svg/logo-helpyfast.svg" alt="logo"></div>

            <h3>Login</h3>
            <h4>Esqueci minha senha</h4>

            <div class="card-inform">

                <!-- IDENTIFICA DE QUEM É A CONTA -->
            <div class="input-grupo">
                <h5>E-mail da sua conta</h5>
                <input type="email" id="email-recuperado" placeholder="Insira o email cadastrado">
            </div>

            <div class="input-grupo">
               <h5>Crie uma nova senha</h5>
               <div class="senha-container">
                    <input type="password" id="senha" placeholder="Crie uma nova senha">

                    <span class="olhinho" onclick="toggleSenha()">
                        <!-- Adicionando id="iconeOlho" -->
                        <img src="/svg/ocultar-senha.svg" id="iconeOlho" alt="olhinho ocultar senha">
                    </span>
                </div>
            </div>

            <ul class="regras-senha">
                <li id="regra-caracteres">Deve ter no mínimo 8 caracteres</li>
                <li id="regra-maiuscula">Pelo menos uma letra maiúscula</li>
                <li id="regra-numero">Pelo menos um número</li>
                <li id="regra-especial">Pelo menos um caracter especial (ex: !, @, #, &...)</li>
            </ul>

            <p id="aviso-senha-antiga" style="display: none; color: #dc3545; font-size: 12px; font-weight: bold; margin-bottom: 10px;">
                ⚠️ Esta já é sua senha atual. Escolha uma nova!
            </p>

            <div class="input-grupo">
                <h5>Confirme sua nova senha</h5>
                <div class="senha-container">
                <input type="password" id="senha-igual" placeholder="Confirme sua nova senha">

                <span class="olhinho" onclick="toggleConfirmar()">
                    <!-- Adicionando id="iconeOlho" -->
                    <img src="/svg/ocultar-senha.svg" id="iconeVer" alt="olhinho ocultar senha">
                </span>
                </div>
            </div>
            
            <button class="botao-continuar" id="btnContinuar">Continuar</button>

        </div>
    </div>

    <!-- JAVA SCRIPT -->
    <script src="/javascript/esqueci-senha.js"></script>
</body>
</html>
