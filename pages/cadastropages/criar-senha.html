<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Criar Senha</title>
</head>
<link rel="stylesheet" href="/style/cadastropages/criar-senha.css">
<body>
        <div class="container">
        <div class="card">
            <div class="robo"><img src="/svg/robo-img.svg" alt="robo"></div>
            <div class="logo"><img src="/svg/logo-helpyfast.svg" alt="logo"></div>

            <h3>Cadastro</h3>
            <h4>Crie sua senha</h4>

            <div class="card-inform">

            <div class="input-grupo">
               <h5>Senha</h5>
               <div class="senha-container">
                    <input type="password" id="senha" placeholder="Crie uma senha">

                    <span class="olhinho" onclick="toggleSenha()">
                        <!-- Adicionando id="iconeOlho" -->
                        <img src="/svg/ocultar-senha.svg" id="iconeOlho" alt="olhinho ocultar senha">
                    </span>
                </div>
            </div>

            <ul class="regras-senha">
                <li id="regra-caracteres">Deve ter no mínimo 8 caracteres</li>
                <li id="regra-maiuscula">Pelo menos uma letra maiúscula</li>
                <li id="regra-numero">Pelo menos um número</li>
                <li id="regra-especial">Pelo menos um caracter especial (ex: !, @, #, &...)</li>
            </ul>

            <div class="input-grupo">
                <h5>Confirme sua senha</h5>
                <div class="senha-container">
                <input type="password" id="senha-igual" placeholder="Confirme sua senha">

                <span class="olhinho" onclick="toggleConfirmar()">
                    <!-- Adicionando id="iconeOlho" -->
                    <img src="/svg/ocultar-senha.svg" id="iconeVer" alt="olhinho ocultar senha">
                </span>
                </div>
            </div>
            
            <a class="botao-continuar" id="btnContinuar" href="/pages/cadastropages/acesso.html">Continuar</a>
        </div>
    </div>

    <script src="/javascript/criar-senha.js"></script>

</body>
</html>
