<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="/style/perfil.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="/IMG/logonavbar.png" alt="Helpy Fast">
        </div>
        <nav>
            <a href="#" class="nav-home">HOME</a>
            <a href="#">CHAMADOS</a>
            <img class="user" src="/svg/iconperfil.svg" alt="perfil">
        </nav>
    </header>

    <div class="card-container">
        <div class="title-box">
            <a href="/pages/home.html" class="back-arrow">
                <img src="/svg/iconsetaleft.svg" alt="seta retornando">
            </a>
            <span>Perfil</span>
        </div>

        <div class="card-big">
            <div class="profile-header">
                <img class="claudio" src="/IMG/claudiorocha.png" alt="claudio">

                <div class="profile-info">
                    <div class="name-section">
                        <h2>Claudio Rocha</h2>
                        <p class="role">Técnico</p>
                        <span class="status">Disponível <i class="dot"></i></span>
                    </div>

                    <div class="overview">
                        <h3>Visão geral</h3>
                        <div class="info-item">
                            <img src="/svg/checkpurple.svg" alt="check">
                            <div>
                                <strong>Disponível • O dia inteiro</strong>
                                <span>Horário de trabalho: 7h - 17h</span>
                            </div>
                        </div>
                        <div class="info-item">
                            <img src="/svg/iconclockyellow.svg" alt="clock">
                            <div>
                                <strong>Próximo serviço • 12h30</strong>
                                <span>Sistema travado - Sala 19</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="skills-section">
                <h3>Habilidades</h3>
                <div class="skills-cards">
                    <div class="skill-card">
                        <img src="/svg/hardware.svg" alt="Hardware">
                        <span>Sistemas de software</span>
                    </div>
                    <div class="skill-card">
                        <img src="/svg/software.svg" alt="Software">
                        <span>Sistemas de hardware</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
