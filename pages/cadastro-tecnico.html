<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Técnico</title>
</head>
<link rel="stylesheet" href="../CSS/cadastros.css">
<body>
        <div class="container">
        <div class="card">
            <div class="robo"><img src="../IMG/robo-img.svg" alt="robo"></div>
            <div class="logo"><img src="../IMG/logo-helpyfast.svg" alt="logo"></div>

            <h3>Cadastro</h3>
            <h4>Informe os dados do funcionário</h4>

            <div class="card-inform">

            <div class="input-grupo">
                <h5>
                    <img src="../IMG/user-img.svg" alt="user" class="icon-h5">
                    E-mail
                </h5>
                <input type="email" id="email" placeholder="Insira seu email">
            </div>

            <div class="input-grupo">
                <h5>
                    <img src="../IMG/especialidade-img.svg" alt="especialidade" class="icon-h5">
                    Especialidade do Técnico
                </h5>
                <select name="especialidade" id="especialidade">
                    <option value="" disabled selected>Selecione a Especialidade</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="ti">T.I</option>
                    <option value="geral">Geral</option>
                </select>
            </div>
            
            <button class="botao-continuar" id="btnContinuar">Continuar</button>

            <!-- bolinhas de navegação "Pagination Dots ou Steppers" -->
             <div class="passos">
                <span class="ponto-ativo"></span>
                <span class="ponto"></span>
                <span class="ponto"></span>
             </div>
        </div>
    </div>

    <!-- JAVA SCRIPT -->
    <script>
        document.querySelector('#btnContinuar').addEventListener('click', function(event) {
            event.preventDefault();

            const email = document.querySelector('#email').value;
            const especialidade = document.querySelector('#especialidade').value;

            if (email === '' || especialidade === '') {
                alert("Ops! Preencha todos os campos para entrar.");
                return;
            }

            localStorage.setItem('emailEmCadastro', email);

            window.location.href = "../HTML/criar-senha.html"
        });
    </script>

</body>
</html>
