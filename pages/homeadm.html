<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<link rel="stylesheet" href="/style/homeadm.css">

<body>

    <header>
        <div class="logo">
            <img src="/IMG/logonavbar.png" alt="Helpy Fast">
        </div>
        <nav>
            <a href="/pages/homeadm.html" class="nav-home">HOME</a>
            <a href="/pages/histchamado.html">CHAMADOS</a>
            <img class="user" src="/svg/iconperfil.svg" alt="perfil">
        </nav>
    </header>


    <div class="card-container">
        <div class="title-box">
            <span>Cadastrar Novo</span>
        </div>

        <div class="container">
            <a href="/pages/cadastro-funcionario.html" class="button-people">
                Funcionário
            </a>
            <a href="/pages/cadastro-tecnico.html" class="button-people" >
                Técnico
            </a>

        </div>

    </div>
    <div class="nao-sei-um-nome">
        <button type="submit" class="button-people">Encaminhar chamado</button>
    </div>

    <div class="card-small">
        <h3>Chamados recentes</h3>

        <div class="item">
            <div class="item-topo">
                <p><strong>Computador travando</strong></p>
                <span class="horario">12:30hr</span>
            </div>
            <div class="linha">
                <img src="/svg/iconclockyellow.svg">
                <span>Em aberto</span>
                <span class="sala">Sala 5</span>
            </div>
            <p class="setor">Administração</p>
        </div>

        <hr>

        <div class="item">
            <div class="item-topo">
                <p><strong>Máquina com defeito</strong></p>
                <span class="horario">08:23hr</span>
            </div>
            <div class="linha">
                <img src="/svg/iconecheckverde.svg">
                <span>Resolvido</span>
                <span class="sala">Oficina 12</span>
            </div>
            <p class="setor">Produção</p>
        </div>

        <hr>

        <div class="item">
            <div class="item-topo">
                <p><strong>Extensões queimadas</strong></p>
                <span class="horario">07:06hr</span>
            </div>
            <div class="linha">
                <img src="/svg/iconcancelado.svg">
                <span>Cancelado</span>
                <span class="sala">Sala 19</span>
            </div>
            <p class="setor">Administração</p>
        </div>


    </div>



</body>

</html>
