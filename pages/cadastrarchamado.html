

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Helpyfast</title>
    <link rel="stylesheet" href="/style/cadastrarchamado.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="/IMG/logonavbar.png" alt="Helpy Fast">
        </div>
        <nav>
            <a href="#" class="nav-home">HOME</a>
            <a href="#">CHAMADOS</a>
            <img class="user" src="/svg/iconperfil.svg" alt="perfil">
        </nav>
    </header>

    <div class="title-box">
        <a href="/pages/home.html" class="back-arrow">
            <img src="/svg/iconsetaleft.svg" alt="seta retornando">
        </a>
        <span>Novo chamado</span>
    </div>

    <div class="subtitle">Qual é o seu problema?</div>

    <div class="container">
        <p class="label-section">Categoria do Problema</p>

        <div class="categories" id="categoria-group">
            <label class="card">
                <input type="radio" name="categoria" value="ti" class="radio-card">
                <img src="/svg/informatica-icon.svg" alt="">
                <div class="card-text">
                    <strong>Informática (TI)</strong>
                    <span>Escritório</span>
                </div>
            </label>

            <label class="card">
                <input type="radio" name="categoria" value="producao" class="radio-card">
                <img src="/svg/machine-icon.svg" alt="">
                <div class="card-text">
                    <strong>Produção</strong>
                    <span>Oficinas</span>
                </div>
            </label>

            <label class="card">
                <input type="radio" name="categoria" value="adm" class="radio-card">
                <img src="/svg/paper-icon.svg" alt="">
                <div class="card-text">
                    <strong>Administrativo</strong>
                    <span>Salas</span>
                </div>
            </label>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <p class="label-section">O que aconteceu?</p>
                <textarea id="descricao" placeholder="Descreva brevemente o problema"></textarea>
            </div>

            <div class="form-group">
                <p class="label-section">Anexar foto (Opcional)</p>
                <label class="upload-box">
                    <input type="file" id="foto-input" style="display: none;" accept="image/*">
                    <img src="/svg/iconphoto.svg" alt="foto">
                    <span id="foto-texto">Adicionar foto</span>
                </label>
            </div>
        </div>

        <div class="input-grupo">
            <p class="localizacion">Adicione sua Localização </p>
            <select name="area" id="localizacao">
                <option value="" disabled selected>Selecione sua Localização</option>
                <option value="sala1">Sala 1</option>
                <option value="sala2">Sala 2</option>
                <option value="sala3">Sala 3</option>
                <option value="sala4">Sala 4</option>
                <option value="sala5">Sala 5</option>
                <option value="oficina_manutencao">Oficina de manutenção</option>
                <option value="producao">Produção</option>
            </select>
        </div>

        <button class="btn-chamado" id="btn-enviar">Enviar chamado</button>
    </div>

    <script>
    
        const fotoInput = document.getElementById('foto-input');
        const fotoTexto = document.getElementById('foto-texto');
        const btnEnviar = document.getElementById('btn-enviar');
        const descricao = document.getElementById('descricao');
        const localizacao = document.getElementById('localizacao');
        const categorias = document.getElementsByName('categoria');

        // coiso pra add foto e mudar o texto
        fotoInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fotoTexto.textContent = `Foto: ${this.files[0].name}`;
                fotoTexto.style.color = "#6200ee";
            }
        });

        
        btnEnviar.addEventListener('click', function() {
            let categoriaSelecionada = false;
            let valorCategoria = "";

            // ve se a categoria foi selecionada 
            for (const radio of categorias) {
                if (radio.checked) {
                    categoriaSelecionada = true;
                    valorCategoria = radio.value;
                    break;
                }
            }

            
            if (!categoriaSelecionada) {
                alert("Por favor, selecione a Categoria do Problema.");
                return;
            }

            if (descricao.value.trim() === "") {
                alert("Por favor, descreva o que aconteceu.");
                descricao.focus();
                return;
            }

            if (localizacao.value === "") {
                alert("Por favor, selecione sua localização.");
                localizacao.focus();
                return;
            }

            
            alert(`Sucesso! Chamado de ${valorCategoria} enviado.`);
            
            console.log({
                categoria: valorCategoria,
                descricao: descricao.value,
                local: localizacao.value,
                foto: fotoInput.files[0] ? fotoInput.files[0].name : "Sem foto"
            });
        });
    </script>

</body>
</html>
