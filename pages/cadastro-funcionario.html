<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Funcionário</title>
</head>
<link rel="stylesheet" href="/style/cadastro-funcionario.css">
<body>
        <div class="container">
        <div class="card">
            <div class="robo"><img src="/IMG/imgrobo.png" alt="robo"></div>
            <div class="logo"><img src="/svg/logo-helpyfast.svg" alt="logo"></div>
 
            <h3>Cadastro</h3>
            <h4>Informe os dados do funcionário</h4>
 
            <div class="card-inform">
 
            <div class="input-grupo">
                <h5>
                    <img src="/svg/user-img.svg" alt="user" class="icon-h5">
                    E-mail
                </h5>
                <input type="email" id="email" placeholder="Insira seu email">
            </div>
 
            <div class="input-grupo">
                <h5>
                    <img src="/svg/data-img.svg" alt="data" class="icon-h5">
                    Data de nascimento
                </h5>
                <input type="date" id="data" placeholder="Insira sua data de nascimento">
            </div>
 
            <div class="input-grupo">
                <h5>
                    <img src="/svg/area-img.svg" alt="area" class="icon-h5">
                    Área do Funcionário
                </h5>
                <select name="area" id="area">
                    <option value="" disabled selected>Selecione a Área</option>
                    <option value="adm">Administração</option>
                    <option value="ti">T.I</option>
                    <option value="producao">Produção</option>
                </select>
            </div>
           
            <button class="botao-continuar" id="btnContinuar">Continuar</button>
 
            <!-- bolinhas de navegação "Pagination Dots ou Steppers" -->
             <div class="passos">
                <span class="ponto-ativo"></span>
                <span class="ponto"></span>
                <span class="ponto"></span>
             </div>
        </div>
    </div>
 
    <!-- JAVA SCRIPT -->
    <script>
        document.querySelector('#btnContinuar').addEventListener('click', function(event) {
            event.preventDefault();
 
            const email = document.querySelector('#email').value;
            const data = document.querySelector('#data').value;
            const area = document.querySelector('#area').value;
 
            if (email === '' || data === '' || area === '') {
                alert("Ops! Preencha todos os campos para entrar.");
                return; // Bloqueia o avanço
            }
 
            localStorage.setItem('emailEmCadastro', email);
 
            window.location.href = "/pages/criar-senha.html";
        });
    </script>
 
</body>
</html>
