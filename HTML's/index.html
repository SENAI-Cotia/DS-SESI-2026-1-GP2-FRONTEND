<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS's/style.css">
</head>
<body>
    <div class="container">
        <div class="card">

            <div class="logo"><img src="../IMG's/logo-helpyfast.png" alt="logo"></div>

            <h3>Bem-vindo, vamos começar!</h3>
            <h4>Faça o login na sua conta!</h4>

            <div class="input-grupo">
                <h5>E-mail</h5>
                <input type="text" placeholder="Insira seu e-mail">
            </div>

            <div class="input-grupo">
                <h5>Senha</h5>
                <div class="senha-container">
                <input type="password" placeholder="Insira sua senha">
                <span class="olhinho" onclick="toggleSenha"></span>
                </div>
            </div>

            <button class="botao-entrar">Entrar</button>
        </div>
    </div>
</body>
</html>
